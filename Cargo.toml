[workspace]
resolver = "2"
members = [
    "crates/kinetix-core",
    "crates/kinetix-app",
    "crates/kinetix-levelforge",
]
exclude = ["vendor/macroquad"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Julien Bombled"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
macroquad = "0.4"

# macroquad 0.4.16 with the upstream font atlas fix backported (see vendor/macroquad/PATCH.md).
# Drop this patch and the vendor/macroquad directory once a release past 0.4.16 ships the fix.
[patch.crates-io]
macroquad = { path = "vendor/macroquad" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
