<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KINETIX</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060512;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: block;
      background: #060512;
      position: absolute;
      inset: 0;
      z-index: 0;
      touch-action: none;
    }
    #kinetix-fs-btn {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(0, 238, 255, 0.45);
      background: rgba(8, 10, 22, 0.72);
      color: #00eeff;
      font: 600 13px/1 system-ui, -apple-system, sans-serif;
      cursor: pointer;
      touch-action: manipulation;
    }
    #kinetix-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(4, 5, 14, 0.82);
    }
    .kinetix-dialog {
      width: min(520px, 100%);
      border-radius: 12px;
      border: 1px solid rgba(0, 238, 255, 0.55);
      background: #0c0e1e;
      color: #eef6ff;
      padding: 18px;
      box-sizing: border-box;
      font: 500 15px/1.4 system-ui, -apple-system, sans-serif;
    }
    .kinetix-dialog-msg {
      margin: 0 0 12px 0;
    }
    .kinetix-dialog-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(0, 238, 255, 0.4);
      background: #050712;
      color: #eef6ff;
      font: 500 14px/1.3 monospace;
      margin-bottom: 14px;
    }
    .kinetix-dialog-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .kinetix-dialog-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(0, 238, 255, 0.55);
      background: #131a36;
      color: #eef6ff;
      font: 600 14px/1.2 system-ui, -apple-system, sans-serif;
      cursor: pointer;
    }
    .kinetix-dialog-btn.primary {
      background: #00b8cc;
      color: #040510;
      border-color: #00eeff;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <button id="kinetix-fs-btn" type="button" aria-label="Fullscreen">[ ]</button>
  <div id="kinetix-modal" role="dialog" aria-modal="true">
    <div class="kinetix-dialog">
      <p id="kinetix-modal-msg" class="kinetix-dialog-msg"></p>
      <input id="kinetix-modal-input" class="kinetix-dialog-input" type="text" autocomplete="off" spellcheck="false">
      <div class="kinetix-dialog-actions">
        <button id="kinetix-modal-close" class="kinetix-dialog-btn" type="button"></button>
        <button id="kinetix-modal-ok" class="kinetix-dialog-btn primary" type="button"></button>
      </div>
    </div>
  </div>
  <script src="gl.js?v=__KINETIX_BUILD__"></script>
  <script>
    const glCanvas = document.getElementById("glcanvas");
    const fsBtn = document.getElementById("kinetix-fs-btn");
    const modalEl = document.getElementById("kinetix-modal");
    const modalMsg = document.getElementById("kinetix-modal-msg");
    const modalInput = document.getElementById("kinetix-modal-input");
    const modalOk = document.getElementById("kinetix-modal-ok");
    const modalClose = document.getElementById("kinetix-modal-close");
    let modalMode = null;
    let pendingImportedCode = null;
    // Only default to touch on pure coarse-pointer devices (never on touchscreen laptops/desktops with a mouse).
    let touchDeviceDetected = Boolean(
      window.matchMedia &&
        window.matchMedia("(pointer: coarse)").matches &&
        !window.matchMedia("(any-pointer: fine)").matches
    );

    function syncViewportSize() {
      const vv = window.visualViewport;
      const w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
      const h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
      glCanvas.style.width = w + "px";
      glCanvas.style.height = h + "px";
      if (fsBtn) {
        const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
        const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        fsBtn.style.display = touchDeviceDetected && fsSupported && !inFs ? "inline-flex" : "none";
      }
    }
    syncViewportSize();
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        syncViewportSize();
        window.dispatchEvent(new Event("resize"));
      });
    }
    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        syncViewportSize();
        window.dispatchEvent(new Event("resize"));
      }, 120);
    });
    document.addEventListener("fullscreenchange", syncViewportSize);
    document.addEventListener("webkitfullscreenchange", syncViewportSize);
    if (fsBtn) {
      fsBtn.addEventListener("click", () => {
        const root = document.documentElement;
        const req = root.requestFullscreen || root.webkitRequestFullscreen;
        if (req) {
          Promise.resolve(req.call(root)).catch(() => {});
        }
      });
    }

    function openModal(mode, message, value, placeholder, okLabel, closeLabel) {
      modalMode = mode;
      modalMsg.textContent = message;
      modalInput.value = value || "";
      modalInput.placeholder = placeholder || "";
      modalInput.readOnly = mode === "share";
      modalOk.textContent = okLabel;
      modalClose.textContent = closeLabel;
      modalEl.style.display = "flex";
      if (document.pointerLockElement === glCanvas) nativeExitPointerLock();
      setTimeout(() => {
        modalInput.focus();
        if (mode === "share") modalInput.select();
      }, 20);
    }

    function closeModal() {
      modalEl.style.display = "none";
      modalMode = null;
      glCanvas.focus();
    }

    modalClose.addEventListener("click", closeModal);
    modalEl.addEventListener("click", (e) => {
      if (e.target === modalEl) closeModal();
    });
    modalOk.addEventListener("click", () => {
      if (modalMode === "share") {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(modalInput.value).catch(() => {});
        }
        closeModal();
      } else if (modalMode === "import") {
        const trimmed = modalInput.value.trim();
        if (trimmed.length > 0) pendingImportedCode = trimmed;
        closeModal();
      }
    });
    modalInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        closeModal();
      } else if (e.key === "Enter" && modalMode === "import") {
        e.preventDefault();
        modalOk.click();
      }
    });
    let lockWanted = false;
    // A lock requested inside a gesture because of the resume mask is kept for this long while the
    // game has not yet set lockWanted (it does so one frame later).
    const SPECULATIVE_LOCK_MS = 250;
    let speculativeUntil = 0;
    let speculativeTimer = null;
    function lockIsWanted() {
      return lockWanted || performance.now() < speculativeUntil;
    }
    // Bitmask of inputs the game will treat as "resume" (see kinetix_set_resume_mask).
    const RESUME_BIT_CLICK = 1;
    const RESUME_KEY_BITS = {
      Space: 2,
      Enter: 4,
      KeyP: 8,
      KeyR: 16,
      F3: 32,
      F4: 64,
      Tab: 128
    };
    let resumeMask = 0;
    let audioCtx = null;
    let musicEnabled = 1;
    let musicIntensity = 0;
    let musicStep = 0;

    // Build views at call time: wasm_memory.buffer is replaced on memory growth.
    function readUtf8(ptr, len) {
      return new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len));
    }

    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSweep(type, fStart, fEnd, duration, gainVal) {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(fStart, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), now + duration);
      gain.gain.setValueAtTime(gainVal, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    // Dynamic Synthwave Bass & Lead Sequencer
    const bassNotes = [55.0, 55.0, 65.41, 55.0, 73.42, 65.41, 82.41, 73.42];
    const leadNotes = [220.0, 261.63, 329.63, 440.0, 392.0, 329.63, 293.66, 329.63];
    setInterval(() => {
      if (!musicEnabled || !audioCtx || audioCtx.state !== "running") return;
      const idx = musicStep % bassNotes.length;
      musicStep++;
      const tempoMult = musicIntensity === 3 ? 1.25 : 1.0;
      const fBass = bassNotes[idx] * tempoMult;
      playSweep("sawtooth", fBass, fBass * 0.98, 0.14, musicIntensity === 0 ? 0.04 : 0.07);
      if (musicIntensity >= 2 && (musicStep % 2 === 0)) {
        const fLead = leadNotes[idx] * (musicIntensity === 3 ? 1.5 : 1.0);
        playSweep("triangle", fLead, fLead * 1.01, 0.11, 0.05);
      }
    }, 180);

    miniquad_add_plugin({
      register_plugin: function (importObject) {
        importObject.env.kinetix_synth_sfx = function (kind, param) {
          switch (kind) {
            case 1:
              playSweep("triangle", 240, 440, 0.08, 0.25);
              break;
            case 2:
              playSweep("sine", 180, 130, 0.06, 0.18);
              break;
            case 3:
              const step = Math.min(param || 1, 16);
              const f0 = 310 * Math.pow(1.059463, step);
              playSweep("square", f0, f0 * 1.45, 0.09, 0.20);
              break;
            case 4:
              playSweep("sawtooth", 120, 28, 0.35, 0.38);
              break;
            case 5:
              playSweep("triangle", 440, 880, 0.18, 0.28);
              break;
            case 6:
              playSweep("sawtooth", 980, 210, 0.075, 0.20);
              break;
            case 7:
              playSweep("square", 860, 290, 0.16, 0.26);
              break;
            case 8:
              playSweep("sine", 320, 960, 0.22, 0.28);
              break;
          }
        };
        importObject.env.kinetix_set_music = function (enabled, intensity) {
          musicEnabled = enabled;
          musicIntensity = intensity;
        };
        importObject.env.kinetix_save_state = function (hs, unlocked, theme, langFr) {
          try {
            localStorage.setItem("kinetix_hs", String(hs));
            localStorage.setItem("kinetix_unlocked", String(unlocked));
            localStorage.setItem("kinetix_theme", String(theme));
            localStorage.setItem("kinetix_lang", String(langFr));
          } catch (_) {}
        };
        importObject.env.kinetix_load_highscore = function () {
          try {
            return parseInt(localStorage.getItem("kinetix_hs") || "0", 10) || 0;
          } catch (_) {
            return 0;
          }
        };
        importObject.env.kinetix_load_packed = function () {
          try {
            const u = (parseInt(localStorage.getItem("kinetix_unlocked") || "0", 10) || 0) & 0xFFFF;
            const t = (parseInt(localStorage.getItem("kinetix_theme") || "0", 10) || 0) & 0xFF;
            const storedLang = localStorage.getItem("kinetix_lang");
            const l = storedLang === null
              ? (/^fr\b/i.test(navigator.language || "") ? 1 : 0)
              : ((parseInt(storedLang, 10) || 0) & 0x1);
            return u | (t << 16) | (l << 24);
          } catch (_) {
            return 0;
          }
        };
        importObject.env.kinetix_save_settings = function (packed) {
          try {
            localStorage.setItem("kinetix_sfx", String(packed & 1));
            localStorage.setItem("kinetix_music", String((packed >> 1) & 1));
            localStorage.setItem("kinetix_reduce_motion", String((packed >> 2) & 1));
          } catch (_) {}
        };
        importObject.env.kinetix_load_settings = function () {
          // Audio defaults to on; reduced motion defaults to the OS/browser media query.
          const mediaReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 0;
          try {
            // A missing or non-numeric stored value keeps the default.
            const flag = (key, defVal) => {
              const n = parseInt(localStorage.getItem(key), 10);
              return Number.isNaN(n) ? defVal : (n ? 1 : 0);
            };
            return flag("kinetix_sfx", 1) | (flag("kinetix_music", 1) << 1) | (flag("kinetix_reduce_motion", mediaReduced) << 2);
          } catch (_) {
            return 3 | (mediaReduced << 2);
          }
        };
        // Generic string storage: key and value cross the boundary as UTF-8 byte ranges.
        importObject.env.kinetix_store_len = function (keyPtr, keyLen) {
          try {
            const value = localStorage.getItem(readUtf8(keyPtr, keyLen));
            if (value === null) return -1;
            return new TextEncoder().encode(value).length;
          } catch (_) {
            return -1;
          }
        };
        importObject.env.kinetix_store_read = function (keyPtr, keyLen, bufPtr, bufCap) {
          try {
            const value = localStorage.getItem(readUtf8(keyPtr, keyLen));
            if (value === null) return -1;
            const encoded = new TextEncoder().encode(value);
            if (encoded.length > bufCap) return -1;
            new Uint8Array(wasm_memory.buffer, bufPtr, encoded.length).set(encoded);
            return encoded.length;
          } catch (_) {
            return -1;
          }
        };
        importObject.env.kinetix_store_write = function (keyPtr, keyLen, valPtr, valLen) {
          // Quota and private-mode errors are reported to the game, not swallowed.
          try {
            localStorage.setItem(readUtf8(keyPtr, keyLen), readUtf8(valPtr, valLen));
            return 1;
          } catch (_) {
            return 0;
          }
        };
        importObject.env.kinetix_share_level = function (
          codePtr, codeLen, msgPtr, msgLen, copyPtr, copyLen, closePtr, closeLen
        ) {
          try {
            const code = readUtf8(codePtr, codeLen);
            const message = readUtf8(msgPtr, msgLen);
            const copyLabel = readUtf8(copyPtr, copyLen);
            const closeLabel = readUtf8(closePtr, closeLen);
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(code).catch(() => {});
            }
            openModal("share", message, code, "", copyLabel, closeLabel);
          } catch (_) {}
        };
        importObject.env.kinetix_request_import_level = function (
          msgPtr, msgLen, phPtr, phLen, importPtr, importLen, closePtr, closeLen
        ) {
          try {
            pendingImportedCode = null;
            openModal(
              "import",
              readUtf8(msgPtr, msgLen),
              "",
              readUtf8(phPtr, phLen),
              readUtf8(importPtr, importLen),
              readUtf8(closePtr, closeLen)
            );
          } catch (_) {}
        };
        importObject.env.kinetix_poll_imported_level = function (bufPtr, maxLen) {
          try {
            if (!pendingImportedCode) return 0;
            const code = pendingImportedCode;
            pendingImportedCode = null;
            const encoded = new TextEncoder().encode(code);
            if (encoded.length === 0) return 0;
            if (encoded.length > maxLen) return maxLen + 1;
            new Uint8Array(wasm_memory.buffer, bufPtr, encoded.length).set(encoded);
            return encoded.length;
          } catch (_) {
            return 0;
          }
        };
        importObject.env.kinetix_set_lang = function (langFr) {
          document.documentElement.lang = langFr ? "fr" : "en";
        };
        importObject.env.kinetix_pointer_lock_active = function () {
          return document.pointerLockElement === glCanvas ? 1 : 0;
        };
        importObject.env.kinetix_set_pointer_bounds = function (left, right) {
          boundsLeft = Number.isFinite(left) ? left : null;
          boundsRight = Number.isFinite(right) ? right : null;
        };
        importObject.env.kinetix_sync_pointer_x = function (cssX) {
          if (!Number.isFinite(cssX)) return;
          const rect = glCanvas.getBoundingClientRect();
          virtualMouseX = clampVirtualX(rect.left + cssX);
        };
        importObject.env.kinetix_set_resume_mask = function (mask) {
          resumeMask = mask >>> 0;
        };
        importObject.env.kinetix_is_touch_device = function () {
          return touchDeviceDetected ? 1 : 0;
        };
        importObject.env.kinetix_set_pointer_lock = function (enabled) {
          lockWanted = enabled !== 0 && !touchDeviceDetected;
          if (lockWanted) {
            requestLock();
          } else {
            // The game withdrew the lock: no speculative grace, exit immediately.
            speculativeUntil = 0;
            clearTimeout(speculativeTimer);
            speculativeTimer = null;
          }
          if (!lockWanted && document.pointerLockElement === glCanvas) {
            document.exitPointerLock();
          }
        };
      },
      on_init: function () {}
    });

    // Pointer lock is requested only when the game asks for it (kinetix_set_pointer_lock).
    window.addEventListener("contextmenu", (e) => e.preventDefault());

    // Physical key code of the Ctrl+Shift chord the game uses; Chromium would bind it to
    // "bookmark all tabs". Only the default action is cancelled: the game still gets the event.
    const GAME_CHORD_KEY_CODE = "KeyD";
    window.addEventListener(
      "keydown",
      (e) => {
        if (e.ctrlKey && e.shiftKey && e.code === GAME_CHORD_KEY_CODE) {
          e.preventDefault();
        }
      },
      true
    );

    function requestLock() {
      if (touchDeviceDetected || modalMode !== null || !glCanvas.requestPointerLock) return;
      try {
        const result = glCanvas.requestPointerLock();
        if (result && typeof result.catch === "function") result.catch(() => {});
      } catch (_) {}
    }

    // requestPointerLock needs a user gesture (Firefox honours it only synchronously inside the
    // input handler), while the game asks one frame later. So also request the lock when the input
    // matches a resume bit; a wrong guess is undone by the pointerlockchange handler.
    function requestLockInGesture(resumeBit) {
      if (touchDeviceDetected || modalMode !== null) return;
      if (document.pointerLockElement === glCanvas) return;
      if (lockWanted) {
        requestLock();
      } else if ((resumeMask & resumeBit) !== 0) {
        // Speculative request: keep it alive until the game confirms (lockWanted) or the window ends.
        speculativeUntil = performance.now() + SPECULATIVE_LOCK_MS;
        clearTimeout(speculativeTimer);
        speculativeTimer = setTimeout(() => {
          speculativeTimer = null;
          speculativeUntil = 0;
          if (!lockWanted && document.pointerLockElement === glCanvas) nativeExitPointerLock();
        }, SPECULATIVE_LOCK_MS);
        requestLock();
      }
    }

    function setTouchMode(enabled) {
      if (touchDeviceDetected === enabled) return;
      touchDeviceDetected = enabled;
      syncViewportSize();
      if (enabled && document.pointerLockElement === glCanvas) {
        nativeExitPointerLock();
      }
    }

    window.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "touch") {
        setTouchMode(true);
      } else if (e.pointerType === "mouse") {
        setTouchMode(false);
      }
    }, { capture: true, passive: true });

    window.addEventListener("pointermove", (e) => {
      if (e.pointerType === "mouse") {
        setTouchMode(false);
      }
    }, { capture: true, passive: true });

    window.addEventListener("touchstart", () => {
      setTouchMode(true);
    }, { capture: true, passive: true });

    glCanvas.addEventListener("mousedown", (e) => {
      ensureAudio();
      requestLockInGesture(e.button === 0 ? RESUME_BIT_CLICK : 0);
    });

    // Touch devices fire no mousedown before the first tap lands: unlock audio on touchend.
    glCanvas.addEventListener("touchend", () => {
      ensureAudio();
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (modalMode !== null) return;
      requestLockInGesture(RESUME_KEY_BITS[e.code] || 0);
    }, true);

    // A refused request is harmless: the next gesture retries.
    document.addEventListener("pointerlockerror", () => {});

    // Horizontal extent of the arena on screen (CSS px relative to the canvas), set by the game.
    let boundsLeft = null;
    let boundsRight = null;
    let justLocked = false;

    function clampVirtualX(x) {
      const rect = glCanvas.getBoundingClientRect();
      let lo = rect.left;
      let hi = rect.right;
      if (boundsLeft !== null && boundsRight !== null && boundsRight >= boundsLeft) {
        lo = Math.max(lo, rect.left + boundsLeft);
        hi = Math.min(hi, rect.left + boundsRight);
      }
      return Math.max(lo, Math.min(hi, x));
    }

    // Seed the virtual X from the last real mouse X (clamped to the arena) when the lock is obtained,
    // so the paddle does not jump. A lost lock needs no handling: the next mousedown or keydown re-requests it.
    document.addEventListener("pointerlockchange", () => {
      if (document.pointerLockElement === glCanvas) {
        if (!lockIsWanted() || touchDeviceDetected) {
          // The game withdrew the lock before the browser granted it.
          document.exitPointerLock();
          return;
        }
        justLocked = true;
        virtualMouseX = clampVirtualX(virtualMouseX);
      } else {
        justLocked = false;
      }
    });

    // While locked, accumulate a virtual X position and keep the last real Y.
    let virtualMouseX = window.innerWidth * 0.5;
    let lastClientY = window.innerHeight * 0.5;
    window.addEventListener("mousemove", (e) => {
      if (e._kinetixSynthetic) return;
      if (document.pointerLockElement === glCanvas) {
        e.stopImmediatePropagation();
        if (justLocked) {
          justLocked = false;
          return;
        }
        const rect = glCanvas.getBoundingClientRect();
        const maxStep = Math.max(120, rect.width * 0.75);
        if (!Number.isFinite(e.movementX) || Math.abs(e.movementX) > maxStep) {
          return;
        }
        virtualMouseX = clampVirtualX(virtualMouseX + e.movementX);
        const synth = new MouseEvent("mousemove", {
          clientX: virtualMouseX,
          clientY: lastClientY,
          bubbles: true
        });
        synth._kinetixSynthetic = true;
        glCanvas.dispatchEvent(synth);
      } else {
        virtualMouseX = e.clientX;
        lastClientY = e.clientY;
      }
    }, true);

    // Under lock, real button events carry a frozen clientX: replace them with flagged synthetic ones
    // at the virtual position so the game never snaps the paddle back.
    ["mousedown", "mouseup"].forEach((type) => {
      window.addEventListener(type, (e) => {
        if (e._kinetixSynthetic) return;
        if (document.pointerLockElement !== glCanvas) return;
        if (type === "mousedown") ensureAudio();
        e.stopImmediatePropagation();
        const synth = new MouseEvent(type, {
          clientX: virtualMouseX,
          clientY: lastClientY,
          button: e.button,
          buttons: e.buttons,
          bubbles: true
        });
        synth._kinetixSynthetic = true;
        glCanvas.dispatchEvent(synth);
      }, true);
    });

    // macroquad re-applies its own cursor grab state every frame, which makes
    // miniquad call document.exitPointerLock() while the game is not using
    // macroquad's grab. Ignore those calls while the game wants the lock.
    const nativeExitPointerLock = document.exitPointerLock.bind(document);
    document.exitPointerLock = function () {
      if (!lockIsWanted()) nativeExitPointerLock();
    };

    load("kinetix-app.wasm?v=__KINETIX_BUILD__");
  </script>
</body>
